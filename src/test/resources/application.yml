spring:
  # Pins the test profile so application-dev.properties (MySQL) never loads here.
  profiles:
    active: test

  # In-memory, so a test run never leaves a database file behind.
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # ddl-auto belongs directly under spring.jpa.hibernate, not under
    # spring.jpa.properties.hibernate, or the schema is never created.
    hibernate:
      ddl-auto: create-drop
    show-sql: false
