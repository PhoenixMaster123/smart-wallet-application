# Test configuration.
#
# This is a PROFILE-SPECIFIC file on purpose. A profile-agnostic application.yml
# here loses to src/main/resources/application.properties, which pins
# spring.profiles.active=dev - so the context came up on the dev profile and
# quietly talked to a local MySQL instead of H2. Profile-specific files win,
# and ApplicationTests activates this profile with @ActiveProfiles("test").

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
