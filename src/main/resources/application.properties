spring.application.name=Smart Wallet Application

# Neither profile-specific file is loaded unless a profile is active, so dev is
# the default. Override with --spring.profiles.active=prod when deploying.
spring.profiles.active=dev

# MVC configuration
# Required by the th:method="PUT"/"PATCH" forms in profile-menu.html and users.html
spring.mvc.hiddenmethod.filter.enabled=true

# Persistence defaults shared by every profile
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.persister.entity=ERROR

# User properties
users.defaultUser.username=Vik1234
users.defaultUser.password=123123
users.defaultUser.country=BULGARIA
