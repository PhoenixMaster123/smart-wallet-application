<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/common.css?v=1.0.5">
  <link rel="stylesheet" type="text/css" href="css/nav-side-bar.css?v=1.0.5">
  <link rel="stylesheet" type="text/css" href="css/home-common.css?v=1.0.5">
  <link rel="stylesheet" type="text/css" href="css/home.css?v=1.0.5">
  <link rel="stylesheet" type="text/css" href="css/upgrade.css?v=1.0.5">
  <link rel="stylesheet" type="text/css" href="css/demo.css?v=1.0.5">
  <title>Upgrade &middot; Smart Wallet</title>
</head>
<body>
<main>
  <div class="nav-bar"></div>
  <div class="home-section" id="tiers"></div>
</main>
<div class="footer"></div>

<template id="tier-template">
  <div class="single-upgrade-box">
    <div class="upgrade-option-header-box">
      <div class="upgrade-option-header">
        <h2></h2>
      </div>
    </div>
    <div class="upgrade-option-benefits">
      <table class="styled-table">
        <thead>
        <tr>
          <th>Benefits</th>
        </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="upgrade-option-price">
      <p class="monthly-price"></p>
      <p>monthly price</p>
      <p class="yearly-price"></p>
      <p>yearly price</p>
    </div>
    <form class="form">
      <label>Choose period</label>
      <select class="period-select" name="subscriptionPeriod">
        <option value="MONTHLY">Monthly (1 month)</option>
        <option value="YEARLY">Yearly (12 months)</option>
      </select>
      <label>Choose wallet to pay with</label>
      <select class="wallet-select" name="walletId"></select>
      <button class="subscription-action-button" type="submit">
        <p>Receive</p>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2H3.30616C3.55218 2 3.67519 2 3.77418 2.04524C3.86142 2.08511 3.93535 2.14922 3.98715 2.22995C4.04593 2.32154 4.06333 2.44332 4.09812 2.68686L4.57143 6M4.57143 6L5.62332 13.7314C5.75681 14.7125 5.82355 15.2031 6.0581 15.5723C6.26478 15.8977 6.56108 16.1564 6.91135 16.3174C7.30886 16.5 7.80394 16.5 8.79411 16.5H17.352C18.2945 16.5 18.7658 16.5 19.151 16.3304C19.4905 16.1809 19.7818 15.9398 19.9923 15.6342C20.2309 15.2876 20.3191 14.8247 20.4955 13.8988L21.8191 6.94969C21.8812 6.62381 21.9122 6.46087 21.8672 6.3335C21.8278 6.22177 21.7499 6.12768 21.6475 6.06802C21.5308 6 21.365 6 21.0332 6H4.57143ZM10 21C10 21.5523 9.55228 22 9 22C8.44772 22 8 21.5523 8 21C8 20.4477 8.44772 20 9 20C9.55228 20 10 20.4477 10 21ZM18 21C18 21.5523 17.5523 22 17 22C16.4477 22 16 21.5523 16 21C16 20.4477 16.4477 20 17 20C17.5523 20 18 20.4477 18 21Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div class="default-label-box current-label" hidden>
        <p>Your current subscription</p>
      </div>
    </form>
  </div>
</template>

<script type="module">
  import { requireUser, walletsOf, activeSubscriptionOf, upgrade, SUBSCRIPTION_PRICES } from './js/store.js?v=1.0.5';
  import { initPage, money } from './js/ui.js?v=1.0.5';

  initPage('subscriptions');
  const user = requireUser();
  if (user) {
    // Benefit copy is taken from upgrade.html, which lists it as static markup.
    const TIERS = [
      { type: 'DEFAULT', cls: 'default', boxCls: '', benefits: ['Unlock 1 wallet', '15% tax per transfer', 'International tax 0.20 cent'] },
      { type: 'PREMIUM', cls: 'premium', boxCls: '', benefits: ['Unlock 2 wallets', '8% tax per transfer', 'International tax 0.20 cent'] },
      { type: 'ULTIMATE', cls: 'ultimate', boxCls: 'ultimate-box', benefits: ['Unlock 5 wallets', '2% tax per transfer', 'International tax 0.20 cent'] },
    ];

    const host = document.getElementById('tiers');
    const template = document.getElementById('tier-template');
    const wallets = walletsOf(user.id);
    const current = activeSubscriptionOf(user.id);

    for (const tier of TIERS) {
      const node = template.content.cloneNode(true);
      const box = node.querySelector('.single-upgrade-box');
      if (tier.boxCls) {
        box.classList.add(tier.boxCls);
      }

      const header = node.querySelector('.upgrade-option-header');
      header.classList.add(tier.cls);
      header.querySelector('h2').textContent = tier.type;
      node.querySelector('.styled-table').classList.add(`${tier.cls}-benefits`);

      const tbody = node.querySelector('tbody');
      for (const benefit of tier.benefits) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.textContent = benefit;
        tr.append(td);
        tbody.append(tr);
      }

      node.querySelector('.monthly-price').textContent = money(SUBSCRIPTION_PRICES[tier.type].MONTHLY);
      node.querySelector('.yearly-price').textContent = money(SUBSCRIPTION_PRICES[tier.type].YEARLY);

      const walletSelect = node.querySelector('.wallet-select');
      for (const wallet of wallets) {
        const option = document.createElement('option');
        option.value = wallet.id;
        const statusLabel = wallet.status === 'ACTIVE' ? '' : ' (INACTIVE)';
        option.textContent = `${wallet.nickname}${statusLabel} - ${money(wallet.balance)} ${wallet.currency}`;
        if (wallet.status !== 'ACTIVE') {
          option.disabled = true;
        }
        walletSelect.append(option);
      }
      const firstActive = wallets.find((w) => w.status === 'ACTIVE');
      if (firstActive) {
        walletSelect.value = firstActive.id;
      }

      const button = node.querySelector('.subscription-action-button');
      const label = node.querySelector('.current-label');

      // Same th:unless / th:if pair the template uses: the tier you are already
      // on shows a label instead of a buy button.
      if (current && current.type === tier.type) {
        button.hidden = true;
        label.hidden = false;
        if (tier.cls !== 'default') {
          label.classList.add(`${tier.cls}-label`);
        }
      }

      node.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const period = e.target.querySelector('.period-select').value;
        const walletId = e.target.querySelector('.wallet-select').value;
        const result = upgrade(user, tier.type, period, walletId);
        if (result.transaction) {
          window.location.href = `transaction.html?id=${encodeURIComponent(result.transaction.id)}`;
        }
      });

      host.append(node);
    }
  }
</script>
</body>
</html>
