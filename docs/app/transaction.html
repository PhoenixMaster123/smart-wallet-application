<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/nav-side-bar.css">
  <link rel="stylesheet" type="text/css" href="css/home-common.css">
  <link rel="stylesheet" type="text/css" href="css/home.css">
  <link rel="stylesheet" type="text/css" href="css/transaction-result.css">
  <link rel="stylesheet" type="text/css" href="css/upgrade-result-menu.css">
  <link rel="stylesheet" type="text/css" href="css/demo.css">
  <title>Transaction &middot; Smart Wallet</title>
</head>
<body>
<main>
  <div class="nav-bar"></div>
  <div class="home-section">
    <div class="single-section-box payment-result-container">

      <div class="payment-box success" id="box-success" hidden>
        <div class="payment-header">
          <div class="icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 6L9 17L4 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <h2>Successful transaction</h2>
          <p>We've successfully processed your payment! Thank you for the contribution!</p>
        </div>
        <div class="payment-details">
          <div class="details">
            <span class="item">Product:</span>
            <span class="value" id="success-description"></span>
          </div>
          <div class="details">
            <span class="item">Amount:</span>
            <span class="value" id="success-amount"></span>
          </div>
        </div>
      </div>

      <div class="payment-box failure" id="box-failure" hidden>
        <div class="payment-header">
          <div class="icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <h2>Transaction failed</h2>
          <p>Unfortunately, your payment could not be processed. Please try again or contact support if the
            issue persists.</p>
        </div>
        <div class="payment-details">
          <div class="details">
            <span class="item">Product:</span>
            <span class="value" id="failure-description"></span>
          </div>
          <div class="details">
            <span class="item">Reason:</span>
            <span class="value" id="failure-reason"></span>
          </div>
        </div>
      </div>

      <div class="details-section">
        <div class="details-section-container">
          <strong>Transaction id: </strong>
          <p id="tx-id"></p>
        </div>
      </div>

      <a href="home.html" class="profile-actions-button">
        <p>Go back</p>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 7H14C17.3137 7 20 9.68629 20 13C20 16.3137 17.3137 19 14 19H4M4 7L8 3M4 7L8 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </a>
    </div>
  </div>
</main>
<div class="footer"></div>

<script type="module">
  import { requireUser, transactionById } from './js/store.js?v=1.0.1';
  import { initPage, money } from './js/ui.js?v=1.0.1';

  initPage('transactions');
  const user = requireUser();
  if (user) {
    const id = new URLSearchParams(window.location.search).get('id');
    const tx = transactionById(id);

    if (!tx || tx.ownerId !== user.id) {
      window.location.href = 'transactions.html';
    } else {
      const set = (elementId, value) => { document.getElementById(elementId).textContent = value; };
      set('tx-id', tx.id);

      if (tx.status === 'SUCCEEDED') {
        document.getElementById('box-success').hidden = false;
        set('success-description', tx.description);
        set('success-amount', `${money(tx.amount)} EUR`);
      } else {
        document.getElementById('box-failure').hidden = false;
        set('failure-description', tx.description);
        set('failure-reason', tx.failureReason);
      }
    }
  }
</script>
</body>
</html>
