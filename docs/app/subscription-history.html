<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/nav-side-bar.css">
  <link rel="stylesheet" type="text/css" href="css/home-common.css">
  <link rel="stylesheet" type="text/css" href="css/home.css">
  <link rel="stylesheet" type="text/css" href="css/subscription-history.css">
  <link rel="stylesheet" type="text/css" href="css/demo.css">
  <title>Subscription History &middot; Smart Wallet</title>
</head>
<body>
<main>
  <div class="nav-bar"></div>
  <div class="home-section">
    <div class="single-section-box subscriptions-container">
      <table class="styled-table">
        <thead>
        <tr>
          <th>Id</th>
          <th>Type</th>
          <th>Status</th>
          <th>Period</th>
          <th>Price</th>
          <th>Effective from</th>
          <th>Effective to</th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<div class="footer"></div>

<script type="module">
  import { requireUser, subscriptionsOf } from './js/store.js?v=1.0.3';
  import { initPage, formatDateTime, money } from './js/ui.js?v=1.0.3';

  initPage('history');
  const user = requireUser();
  if (user) {
    // SubscriptionPeriod carries a display name; the enum name alone is not it.
    const PERIOD_LABELS = { MONTHLY: 'Monthly (1 month)', YEARLY: 'Yearly (12 months)' };
    const STATUS_CLASSES = { ACTIVE: 'active', COMPLETED: 'completed', TERMINATED: 'terminated' };

    const rows = document.getElementById('rows');

    for (const sub of subscriptionsOf(user.id)) {
      const tr = document.createElement('tr');

      const idCell = document.createElement('td');
      idCell.textContent = sub.id;

      const typeCell = document.createElement('td');
      const type = document.createElement('p');
      type.textContent = sub.type;
      typeCell.append(type);

      const statusCell = document.createElement('td');
      const status = document.createElement('p');
      status.className = `status ${STATUS_CLASSES[sub.status]}`;
      status.textContent = sub.status;
      statusCell.append(status);

      const periodCell = document.createElement('td');
      periodCell.textContent = PERIOD_LABELS[sub.period];

      const priceCell = document.createElement('td');
      priceCell.textContent = money(sub.price);

      const fromCell = document.createElement('td');
      fromCell.textContent = formatDateTime(sub.createdOn);

      const toCell = document.createElement('td');
      toCell.textContent = formatDateTime(sub.expiryOn);

      tr.append(idCell, typeCell, statusCell, periodCell, priceCell, fromCell, toCell);
      rows.append(tr);
    }
  }
</script>
</body>
</html>
