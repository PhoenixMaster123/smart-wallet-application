<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&amp;display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/form.css">
  <link rel="stylesheet" type="text/css" href="css/demo.css">
  <title>Login &middot; Smart Wallet</title>
</head>
<body>

<main>
  <section class="section full-height">

    <div class="container">
      <a href="../index.html" class="logo-big">
        <img src="images/smart-wallet-text-only.png" alt="Logo Image">
      </a>
    </div>

    <form class="form" id="login-form" novalidate>

      <h3>Login Here</h3>

      <p class="alert-warning" id="login-error" hidden></p>

      <label for="username">Username</label>
      <input type="text" placeholder="Username" id="username" name="username" value="Vik1234" autocomplete="username">

      <label for="password">Password</label>
      <input type="password" placeholder="Password" id="password" name="password" value="123123" autocomplete="current-password">

      <button type="submit">Log In</button>

      <p class="form-already">
        Don't have an account? <a href="register.html">Register now</a>!
      </p>
      <p class="form-already" style="margin-top: 10px; font-size: 13px;">
        Seeded user: <code>Vik1234</code> / <code>123123</code> &middot; <a href="../index.html">Read the docs</a>
      </p>

    </form>

  </section>
</main>
<div class="footer"><p>&copy; 2025 Smart Wallet. All rights reserved.</p></div>

<script type="module">
  import { signIn, signOut, currentUser } from './js/store.js';

  const isLogout = new URLSearchParams(window.location.search).has('logout');
  if (isLogout) {
    signOut();
  } else if (currentUser()) {
    window.location.href = 'home.html';
  }

  const form = document.getElementById('login-form');
  const error = document.getElementById('login-error');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (signIn(username, password)) {
      window.location.href = 'home.html';
      return;
    }

    error.textContent = 'Invalid username or password';
    error.hidden = false;
  });
</script>
</body>
</html>
