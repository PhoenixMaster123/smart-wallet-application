<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/nav-side-bar.css">
  <link rel="stylesheet" type="text/css" href="css/home-common.css">
  <link rel="stylesheet" type="text/css" href="css/home.css">
  <link rel="stylesheet" type="text/css" href="css/profile-menu.css">
  <link rel="stylesheet" type="text/css" href="css/demo.css">
  <title>Profile &middot; Smart Wallet</title>
</head>
<body>
<main>
  <div class="nav-bar"></div>
  <div class="home-section">
    <div class="single-section-box profile-menu">
      <div class="profile-header">
        <img id="avatar" alt="Profile Picture" class="profile-avatar">
        <h2 class="profile-name" id="profile-name">Mandarin0016</h2>
      </div>

      <div class="details-section">
        <div class="details-section-container">
          <strong>User id: </strong>
          <p id="profile-id"></p>
        </div>
        <div class="details-section-container">
          <strong>Last profile update: </strong>
          <p id="profile-updated"></p>
        </div>
      </div>

      <form class="form" id="profile-form" novalidate>

        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="First Name">
        <p class="alert-warning" id="err-firstName" hidden>Invalid first name</p>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Last Name">
        <p class="alert-warning" id="err-lastName" hidden>Invalid last name</p>

        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Email Address">
        <p class="alert-warning" id="err-email" hidden>Invalid email address</p>

        <label for="profilePicture">Profile Picture URL</label>
        <input type="text" id="profilePicture" placeholder="Image Link">
        <p class="alert-warning" id="err-profilePicture" hidden>Invalid image link</p>

        <button class="profile-actions-button" type="submit">
          <p>Save</p>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>

      </form>
    </div>
  </div>
</main>
<div class="footer"></div>

<script type="module">
  import { requireUser, updateProfile } from './js/store.js?v=1.0.3';
  import { initPage, formatDateTime } from './js/ui.js?v=1.0.3';

  initPage('home');
  const user = requireUser();
  if (user) {
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239ca3af'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
    const isHttpUrl = (value) => /^https?:\/\/\S+$/i.test(value);

    const avatarEl = document.getElementById('avatar');
    avatarEl.onerror = () => { avatarEl.src = DEFAULT_AVATAR; };
    avatarEl.src = isHttpUrl(user.profilePicture || '') ? user.profilePicture : DEFAULT_AVATAR;

    const fullName = [user.firstName, user.lastName].filter(Boolean).join(' ');
    document.getElementById('profile-name').textContent = fullName || user.username;
    document.getElementById('profile-id').textContent = user.id;
    document.getElementById('profile-updated').textContent = formatDateTime(user.updatedOn);

    for (const field of ['firstName', 'lastName', 'email', 'profilePicture']) {
      document.getElementById(field).value = user[field] ?? '';
    }

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const values = {};
      for (const field of ['firstName', 'lastName', 'email', 'profilePicture']) {
        values[field] = document.getElementById(field).value.trim();
        document.getElementById(`err-${field}`).hidden = true;
      }

      // Mirrors EditProfileRequest: @Size(2,30) on the names, @Email, @URL.
      // Each is optional, so a blank value passes.
      const invalid = [];
      for (const field of ['firstName', 'lastName']) {
        if (values[field] && (values[field].length < 2 || values[field].length > 30)) {
          invalid.push(field);
        }
      }
      if (values.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) {
        invalid.push('email');
      }
      if (values.profilePicture && !isHttpUrl(values.profilePicture)) {
        invalid.push('profilePicture');
      }

      if (invalid.length > 0) {
        for (const field of invalid) {
          document.getElementById(`err-${field}`).hidden = false;
        }
        return;
      }

      updateProfile(user.id, values);
      window.location.href = 'home.html';
    });
  }
</script>
</body>
</html>
